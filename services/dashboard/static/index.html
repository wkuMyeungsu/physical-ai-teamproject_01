<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR 파이프라인 대시보드</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e3e6ea; --ink:#1b1f24; --muted:#6b7480;
  --green:#16a34a; --blue:#2563eb; --violet:#7c3aed; --amber:#d97706;
  --soft:#f0f2f5; --on-violet:#fff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121417; --panel:#1b1e23; --line:#2c3138; --ink:#e8eaed; --muted:#8c94a3;
  --green:#4ade80; --blue:#60a5fa; --violet:#a78bfa; --amber:#fbbf24;
  --soft:#23272e; --on-violet:#160d2b;
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:18px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.badge.mock{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber);font-weight:700}
main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.2fr) minmax(320px,1.3fr);gap:16px;padding:16px 20px;max-width:1400px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;min-height:520px;border-top:4px solid var(--c)}
.panel h2{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-qr{--c:var(--green)} .p-live{--c:var(--blue)} .p-rag{--c:var(--violet)}
.status{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.on{color:var(--green)} .status.on::before{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.muted{color:var(--muted);font-size:13px}

/* 1. QR */
.qr-box{align-self:center;background:#fff;padding:12px;border-radius:8px;margin:8px 0 12px;min-width:224px;min-height:224px;display:grid;place-items:center}
.qr-box img{width:200px;height:200px;display:block}
.viewer{aspect-ratio:4/3;background:#111;border-radius:8px;overflow:hidden;margin:8px 0 10px}
.viewer img{width:100%;height:100%;object-fit:contain;display:block}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.url{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--soft);padding:8px 10px;border-radius:6px}
.steps{margin:12px 0 0;padding-left:20px;font-size:13px;color:var(--muted)}

/* 2. 실시간 저장 현황 */
.count{font-size:44px;font-weight:800;line-height:1;color:var(--blue)}
.count small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.sub{display:flex;gap:16px;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
.feed li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
.feed li.new{border-color:var(--blue);animation:slide .4s ease}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}}
.feed .top{display:flex;gap:8px;align-items:baseline;font-size:13px}
.feed .id{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:12px}
.feed .title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .time{font-size:11px;color:var(--muted)}
.feed .text{margin:2px 0 0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 3. RAG 검색 */
form{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
button{font:inherit;font-weight:700;padding:0 16px;border:0;border-radius:8px;background:var(--violet);color:var(--on-violet);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.examples button{font-weight:400;font-size:12px;padding:4px 10px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.answer{border-left:3px solid var(--violet);background:var(--soft);border-radius:6px;padding:12px 14px;white-space:pre-wrap}
.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sources span{font-size:12px;font-family:ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>OCR 파이프라인 대시보드</h1>
  <span class="badge mock" id="mock-badge" hidden></span>
  <span class="badge" id="health">서버 확인 중…</span>
</header>

<main>
  <!-- 1. QR 카메라 연동 -->
  <section class="panel p-qr" aria-labelledby="h-qr">
    <h2 id="h-qr">① QR 카메라 연동 <span class="status" id="cam-status">대기 중</span></h2>
    <div class="qr-box" id="qr-box"><img id="qr-img" alt="카메라 연결용 QR 코드" hidden><span class="muted" id="qr-msg">세션 만드는 중…</span></div>
    <div class="viewer" id="viewer" hidden><img id="live" alt="휴대폰 카메라 실시간 화면"></div>
    <div class="meta">세션 <b id="sid">—</b> · 프레임 <b id="frames">0</b> · <b id="fps">0</b> fps</div>
    <div class="url" id="capture-url">—</div>
    <ol class="steps">
      <li>휴대폰 카메라로 QR을 스캔한다</li>
      <li>열린 페이지에서 카메라 권한을 허용한다</li>
      <li>모니터의 영어 원문을 비춘다</li>
    </ol>
  </section>

  <!-- 2. 실시간 저장 현황 -->
  <section class="panel p-live" aria-labelledby="h-live">
    <h2 id="h-live">② 실시간 저장 현황 <span class="status" id="live-status">대기 중</span></h2>
    <div class="count"><span id="saved">0</span><small>건 저장</small></div>
    <div class="sub"><span>최근 1분 <b id="per-min">0</b>건</span><span>마지막 저장 <b id="last-at">—</b></span></div>
    <ul class="feed" id="feed" aria-live="polite"></ul>
  </section>

  <!-- 3. RAG 검색 -->
  <section class="panel p-rag" aria-labelledby="h-rag">
    <h2 id="h-rag">③ RAG 검색</h2>
    <form id="ask-form">
      <input id="q" aria-label="질문" placeholder="저장된 원문에 대해 질문하세요 (영어)" autocomplete="off">
      <button id="ask-btn">검색</button>
    </form>
    <div class="examples" id="examples"></div>
    <div id="result" aria-live="polite"><p class="muted">질문을 입력하면 저장된 원문을 근거로 답합니다.</p></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
