# 서비스 1개 = services/<서비스>/ 폴더 1개 = 컨테이너 1개.
# 각 폴더에 Dockerfile이 생기면 그 서비스부터 동작한다.
# 내 서비스만: docker compose up --build <서비스>   전체: docker compose up --build
# 컨테이너끼리는 서비스 이름으로 부른다. 예: http://ocr-extract:8002
services:
  dashboard:
    build: ./services/dashboard
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]

  frame-capture:
    build: ./services/frame-capture
    ports: ["8001:8001"]
    env_file: [{ path: .env, required: false }]
    environment:
      # 휴대폰이 열 HTTPS 주소(proxy 8080에 연결한 터널). 예: .env에 PUBLIC_BASE_URL=https://xxxx.trycloudflare.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

  ocr-extract:
    build: ./services/ocr-extract
    ports: ["8002:8002"]
    env_file: [{ path: .env, required: false }]

  vector-store:
    build: ./services/vector-store
    ports: ["8003:8003"]
    env_file: [{ path: .env, required: false }]

  rag-chat:
    build: ./services/rag-chat
    ports: ["8004:8004"]
    env_file: [{ path: .env, required: false }]

  # 입구: http://localhost:8080 하나로 대시보드 + 휴대폰 페이지. 터널(외부 HTTPS 주소)은 이 포트에 연결한다. 경로 규칙은 Caddyfile.
  proxy:
    image: caddy:2.8-alpine
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [dashboard, frame-capture]
